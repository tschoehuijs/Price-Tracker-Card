name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: node --check price-tracker-card.js

      - name: Run mocked unit tests
        run: node --test tests/price-tracker-card.test.cjs
